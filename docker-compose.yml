services:
  postgres:
    image: postgres:16-alpine
    container_name: firsthing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: firsthing
    ports:
      - "5432:5432"
    volumes:
      - firsthing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firsthing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  firsthing_pgdata:
