        when: "the proposal is marked \"agreed,\""
        then: "the `Pipeline` still advances to `survey-pending` — the survey is never skipped (CON-24) — and it is the *post-survey* branch that differs, going to KYC/offer rather than to demo commissioning"
        tests: [TC-002-5]
