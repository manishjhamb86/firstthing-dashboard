invariants:
  - id: INV-02
    statement: "Every savings/billing figure traces to the readings and benchmark version that produced it"
    enforced_by: [GATE-01]
  - id: INV-03
    statement: "Invoices are never edited once issued; a correction is a new version and both are kept"
    enforced_by: [GATE-02]
  - id: INV-05
    statement: "No account can see or act on another society's data"
    enforced_by: [GATE-03]
  - id: CON-45
    statement: "Portal binding acts (accept offer, sign completion, dispute) require office-bearer authority, checked server-side"
    enforced_by: [GATE-04]

gates:
  - id: GATE-01
    name: "Provenance on every write"
    description: "Every Reading, calculation and report write records its source, version and inputs (FEAT-047, FEAT-048, FEAT-059) -- INV-02 has no other enforcement point."
    enforced_in: [FEAT-047, FEAT-048, FEAT-059]
  - id: GATE-02
    name: "Append-only billing documents"
    description: "FEAT-053/FEAT-054 never update an issued invoice or released report in place; a correction creates a new version with both retained -- INV-03."
    enforced_in: [FEAT-053, FEAT-054]
  - id: GATE-03
    name: "Server-side society scoping"
    description: "Every query and Server Action checks the acting account's societyId against the resource, not just the UI route -- INV-05. A named platform-wide rule, not a per-feature one; Phase 7 records where it is enforced structurally (middleware/query layer) vs per-action."
    enforced_in: [FEAT-086]
  - id: GATE-04
    name: "Server-side authority check on binding acts"
    description: "FEAT-028 (offer accept/counter/reject), FEAT-037 (completion sign-off) and billing disputes check portalAuthority == office-bearer server-side before the act commits -- CON-45. A disabled button is a courtesy; this is the guarantee."
    enforced_in: [FEAT-108, FEAT-028, FEAT-037]

