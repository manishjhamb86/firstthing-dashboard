        given: "the gate is skipped with backend approval"
        when: "the condition is evaluated"
        then: "the skip is recorded against the project's once-only allowance and a second skip attempt is refused (CON-21) — a hard count, enforced here rather than by FEAT-032"
        tests: [TC-035-5]
