      - id: FEAT-002-AC-3
        type: failure
        given: "the outcome is \"declined,\" when saved"
        when: "the action is attempted"
        then: "the `Pipeline` is marked closed/lost with a reason field, and no further CAP-16+ action is possible against it without explicitly reopening as a new lead"
        tests: [TC-002-3]
