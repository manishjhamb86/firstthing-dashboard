  - id: FEAT-014
    title: "Post-install monitoring window & benchmark computation"
    capability: CAP-02
    personas: [PER-04, PER-01]
    surfaces: [SUR-02, SUR-01]
    size: L
    serves: [JTBD-05, GOAL-06]
    description: "Mirrors FEAT-012's mechanism for the post-install side: 5 consecutive valid calendar days (light-replacement day excluded, identical anomaly-reset). Once complete, the system computes % savings between the baseline and post-install averages (CON-10). If the result falls within the valid 60-80% range (CON-20), that exact measured percentage becomes `Circuit.benchmarkSavingsPct` — fixed for the contract term. Outside that range, the result routes to FEAT-015 for investigation instead of being written as the benchmark."
    priority:
      method: RICE
      reach: 6
      impact: 3
      confidence: 1.0
      effort_sessions: 6
      score: 3.0
      estimate_confidence: medium
      rank: 33
      note: "Benchmark computation. This number is the contract"
      override_reason: null
    release: R0
    depends_on: [FEAT-013]
    status: ready
    milestone: MS-04
    acceptance_criteria:
      - id: FEAT-014-AC-1
        type: happy
        given: "5 valid post-install days complete and the result is 68% (within 60-80%)"
        when: "computed"
        then: "`Circuit.benchmarkSavingsPct = 68%` is written and the circuit moves to `benchmark-confirmed`"
        tests: [TC-014-1, TC-014-1-E2E]
      - id: FEAT-014-AC-2
        type: empty
        given: "the post window has just started"
        when: "the screen renders"
        then: "day 1 of 5 shows clearly (same pattern as FEAT-012)"
        tests: [TC-014-2]
      - id: FEAT-014-AC-3
        type: failure/anomaly
        given: "a monitoring window restarts after an anomaly"
        when: "the valid-day count resets"
        then: "the restart mechanism is identical to FEAT-012's pre-install window, but the DETECTION rule is not: a post-install day is anomalous when its implied savings against the in-force baseline falls outside CON-20's 60-80% band, not when it varies >±5% from the running average"
        tests: [TC-014-3]
        scope_note: "Changed 2026-08-15. ±5% is a self-consistency check — the only question available pre-install, where no baseline exists yet. Post-install there is a baseline and CON-20 already defines a plausible day against it. Running ±5% here flagged ordinary jitter between good days, and since an anomaly resets the count, a healthy circuit could never finish its window. The band subsumes the data-quality cases the ±5% rule caught (a dead meter reads as 100% savings; a 10x transcription error as negative savings). FEAT-045's ±5% is unchanged — different question, different path."
      - id: FEAT-014-AC-4
        type: permission
        given: "a non-PER-04/PER-01 actor"
        when: "they attempt the action"
        then: "no visibility into triggering restarts; benchmark-writing is a system computation, not a manual entry, so no one can hand-edit the resulting percentage directly"
        tests: [TC-014-4]
      - id: FEAT-014-AC-5
        type: edge
        given: "the computed result is below 60% or above 80%"
        when: "the window completes"
        then: "no benchmark is written — the result instead routes to FEAT-015's next-morning investigation queue"
        tests: [TC-014-5]
      - id: FEAT-014-AC-6
        type: edge
        given: "a circuit is genuinely under-performing, so every post-install day flags under AC-3 and the window can never complete"
        when: "PER-04 escalates the recorded out-of-band days"
        then: "a FEAT-015 review is raised carrying those readings and the baseline they were judged against — 'record the fix and restart' is refused as an answer, because nothing was fixed"
        tests: []
        scope_note: "Added 2026-08-15 alongside the AC-3 detection change. Without it FEAT-015's queue is unreachable in practice: five days each judged in-band can only ever average in-band, so AC-5's completion path alone cannot raise a review."
    stories:
      - id: STORY-014-1
        title: "As ops, I want the post-install monitoring window to compute the benchmark automatically once it completes, so that the number the whole contract prices against is system-produced, not hand-calculated."
        estimate_days: 3
        satisfies: [FEAT-014-AC-1]
        status: ready
        depends_on: []
      - id: STORY-014-2
        title: "Harden Post-install monitoring window & benchmark computation: permission handling (FEAT-014-AC-4)"
        estimate_days: 1
        satisfies: [FEAT-014-AC-4]
        status: proposed
        depends_on: []
      - id: STORY-014-3
        title: "Harden Post-install monitoring window & benchmark computation: edge/empty/failure/anomaly handling (FEAT-014-AC-2, FEAT-014-AC-3, FEAT-014-AC-5)"
        estimate_days: 2
        satisfies: [FEAT-014-AC-2, FEAT-014-AC-3, FEAT-014-AC-5]
        status: proposed
        depends_on: []
