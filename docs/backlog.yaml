goals:
  - id: GOAL-01
    title: "Make the monthly billing decision a system output, not a spreadsheet exercise"
    horizon: MVP
  - id: GOAL-02
    title: "Give every society one portal showing cumulative savings across all its active service lines"
    horizon: MVP
  - id: GOAL-03
    title: "Model the service-line abstraction so adding a new one does not require schema surgery"
    horizon: MVP
  - id: GOAL-06
    title: "Make every savings figure traceable back to the readings and benchmark version that produced it"
    horizon: MVP
  - id: GOAL-08
    title: "Give ops a portfolio-wide, per-circuit view of consumption against benchmark, with automatic flagging"
    horizon: MVP
  - id: GOAL-05
    title: "Give ops a single operational view across tickets, inspections and spare inventory"
    horizon: v1
  - id: GOAL-07
    title: "Reach 200 active societies without a repeat of the schema/ops rework each service line has cost"
    horizon: v1

