        type: happy
        given: "a batch the society has disputed"
        when: "the field team reopens it for rework, with a recorded reason"
        then: "the batch returns to a workable state and the dispute's review is cleared, so the redone work goes back to the society for approval — a dispute is never overridden into an approval by the back office"
        tests: [TC-035-6]
        scope_note: >-
          Added to R0 on 2026-08-14, found while walking the flow rather than while reading
          the spec. FEAT-035 lets the society dispute a day and FEAT-037-AC-3 refuses
          completion while any batch is disputed, but nothing in either feature returned a
          disputed batch to a workable state — so one dispute made a project permanently
          uncompletable, which is not what "tomorrow blocked pending resolution" means. The
          fix is deliberately a reopen for rework, not an ops override marking it approved:
          the society's approval is the only thing CON-21's gate accepts.
