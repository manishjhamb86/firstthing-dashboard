    title: "Ingest health monitoring & alerting"
    capability: CAP-03
    personas: [PER-01]
    surfaces: [SUR-01]
    size: M
    serves: [GOAL-01, INV-09]
    description: "Continuous monitoring of ingest across both paths, distinguishing the three failure types the user named: (a) the vendor API is erroring or unreachable, (b) a specific meter is offline or not reporting, (c) readings for a period are missing for a meter that is otherwise reporting. Each surfaces as an alert with its own severity and its own resolution path."
    priority:
      method: RICE
      reach: 200
      impact: 2
      confidence: 0.5
      effort_sessions: 4
      score: 50.0
      estimate_confidence: low
      rank: 106
      note: "Same assumption; but this is what makes the API path trustworthy"
      override_reason: null
    release: null  # spike-gated, see spikes[] / cut[]
    depends_on: [FEAT-040, FEAT-043, FEAT-104]
    blocked_by_spike: SPIKE-01
    status: proposed
    architecture_notes: "docs/engineering/09-architecture.md §11 RISK-06 (alert fatigue -- dedup + close-window-proportional severity need tuning against real data post-launch, not resolvable pre-build); the missing-readings branch (CSV-path only) does not depend on SPIKE-01 and can be built ahead of it, per the feature's own minimum-viable-version note."
    acceptance_criteria:
      - id: FEAT-106-AC-1
        type: happy
        given: "all meters reporting on schedule"
        when: "the action is attempted"
        then: "the ingest health view shows a caught-up state and raises nothing"
        tests: []
      - id: FEAT-106-AC-2
        type: empty
        given: "a newly-commissioned meter with no history"
        when: "the screen renders"
        then: "it is shown as `awaiting first reading` and not alerted as offline until its first expected interval passes"
        tests: []
      - id: FEAT-106-AC-3
        type: failure — api
        given: "the vendor API"
        when: "fails for 3 consecutive runs"
        then: "one alert is raised naming the API as the cause, with the last successful fetch time"
        tests: []
      - id: FEAT-106-AC-4
        type: failure — meter
        given: "one meter stops reporting while others continue"
        when: "the action is attempted"
        then: "it is alerted as offline, with its last-seen timestamp and a link to raise a field visit"
        tests: []
      - id: FEAT-106-AC-5
        type: failure — period gap
        given: "a meter reporting normally but missing days 8–11"
        when: "the action is attempted"
        then: "a gap alert is raised naming the exact dates, distinct from an offline alert"
        tests: []
      - id: FEAT-106-AC-6
        type: permission
        given: "a non-PER-01 actor"
        when: "they attempt the action"
        then: "alerts are visible but not resolvable"
        tests: []
      - id: FEAT-106-AC-7
        type: edge
        given: "a CSV"
        when: "upload later fills a gap that was alerted"
        then: "the alert resolves automatically and records what closed it"
        tests: []
  - id: FEAT-107
    title: "Upload reconciliation & overwrite control"
    capability: CAP-03
    personas: [PER-01]
    surfaces: [SUR-01]
    size: M
    serves: [JTBD-01, INV-02]
    priority:
      method: RICE
      reach: 200
      impact: 3
      confidence: 1.0
      effort_sessions: 5
      score: 120.0
      estimate_confidence: medium
      rank: 43
      note: "No silent overwrite. CON-43 as revised by the user 2026-08-13"
      override_reason: null
    release: R1
    depends_on: [FEAT-043, FEAT-044, FEAT-104]
    status: proposed
    acceptance_criteria:
      - id: FEAT-107-AC-1
        type: happy
        given: "every row in an uploaded file exactly matches a stored reading"
        when: "the batch is committed"
        then: "nothing is written and no warning is shown"
        tests: []
      - id: FEAT-107-AC-2
        type: failure
        given: "an incoming value differs from the stored reading for the same interval"
        when: "the batch is committed without that row selected"
        then: "the stored value is left unchanged"
        tests: []
      - id: FEAT-107-AC-3
        type: happy
        given: "a file contains conflicting intervals"
        when: "the reconciliation report renders"
        then: "every conflict shows the stored value, the incoming value, the difference, and where the stored value came from"
        tests: []
      - id: FEAT-107-AC-4
        type: edge
        given: "intervals inside the period have no reading from either source"
        when: "reconciliation runs"
        then: "they are listed as gaps and nothing is imputed in their place"
        tests: []
      - id: FEAT-107-AC-5
        type: happy
        given: "a conflict is selected and its confirmation accepted"
        when: "the overwrite applies"
        then: "the superseded value, its source, and the user who replaced it are all retained"
        tests: []
      - id: FEAT-107-AC-6
        type: failure
        given: "a reading sits inside a released calculation"
        when: "an overwrite is attempted on it"
        then: "it is refused with the reason stated, with or without confirmation"
        tests: []
      - id: FEAT-107-AC-7
        type: edge
        given: "a scheduled API fetch returns a value that differs from a stored reading"
        when: "the fetch completes"
        then: "the conflict is recorded and surfaced without being applied"
        tests: []
      - id: FEAT-107-AC-8
        type: empty
        given: "a period holds no stored readings at all"
        when: "a file is committed"
        then: "every row classifies as new and no reconciliation panel is shown"
        tests: []
      - id: FEAT-107-AC-9
        type: permission
        given: "a user without the ops role"
        when: "they attempt to apply an overwrite"
        then: "it is refused server-side, not merely hidden in the UI"
        tests: []
  - id: FEAT-108
    title: "Society portal accounts & authority"
    capability: CAP-13
    personas: [PER-05, PER-01]
    surfaces: [SUR-01]
    size: M
    serves: [GOAL-02, INV-05]
    priority:
      method: RICE
      reach: 50
      impact: 3
      confidence: 1.0
      effort_sessions: 4
      score: 37.5
      estimate_confidence: medium
      rank: 8
      note: "Portal accounts & authority. CON-45 — the binding acts sit here"
      override_reason: null
    release: R0
    depends_on: [FEAT-085]
    status: ready
    milestone: MS-02
    architecture_notes: "docs/engineering/09-architecture.md §6 -- portalAuthority is a second, orthogonal authorization model alongside AdminUser.permissions, deliberately not unified; GATE-04's binding-act check is server-side on the action per this feature's own AC-2, matching the existing manage_admins precedent."
    acceptance_criteria:
      - id: FEAT-108-AC-1
        type: happy
        given: "an account holds `office-bearer`"
        when: "they accept an offer"
        then: "it is accepted and recorded against that account"
        tests: [TC-108-1, TC-108-1-E2E]
      - id: FEAT-108-AC-2
        type: permission
        given: "an account holds `committee` or `manager`"
        when: "they open an offer"
        then: "the accept action is refused server-side and the screen names who can perform it"
        tests: [TC-108-2]
      - id: FEAT-108-AC-3
        type: happy
        given: "an account holds `manager`"
        when: "they approve a daily batch"
        then: "the approval records the account, the authority held at that moment, and `capturedAt`"
        tests: [TC-108-3]
      - id: FEAT-108-AC-4
        type: failure
        given: "a society has exactly one active `office-bearer`"
        when: "an attempt is made to remove or demote that account"
        then: "it is refused and the rule is named"
        tests: [TC-108-4]
      - id: FEAT-108-AC-5
        type: happy
        given: "an `office-bearer` holds the designation"
        when: "they transfer it to another account of the same society"
        then: "the new account holds it and the previous one keeps its other authorities"
        tests: [TC-108-5]
      - id: FEAT-108-AC-6
        type: edge
        given: "a society has no reachable `office-bearer` after an AGM"
        when: "PER-01 re-designates one"
        then: "the change is recorded with who made it and why"
        tests: [TC-108-6]
      - id: FEAT-108-AC-7
        type: permission
        given: "an account belongs to one society"
        when: "it requests any other society's data or acts on it"
        then: "the request is refused server-side (INV-05)"
        tests: [TC-108-7]
      - id: FEAT-108-AC-8
        type: empty
        given: "a society has no portal accounts"
        when: "PER-01 opens its account list"
        then: "an empty state explains the consequence and offers to create the first one"
        tests: [TC-108-8]
      - id: FEAT-108-AC-9
        type: edge
        given: "an approval was recorded under an authority that has since changed"
        when: "the record is read back"
        then: "it still states the authority held at the time of the act"
        tests: [TC-108-9]
    stories:
      - id: STORY-108-1
        title: "As ops, I want a society's portal accounts to carry named, differentiated authority, so that the binding acts CON-45 requires are only ever performed by someone who actually holds that authority."
        estimate_days: 2
        satisfies: [FEAT-108-AC-1, FEAT-108-AC-3, FEAT-108-AC-5]
        status: ready
        depends_on: []
      - id: STORY-108-2
        title: "Harden Society portal accounts & authority: failure/permission handling (FEAT-108-AC-2, FEAT-108-AC-4, FEAT-108-AC-7)"
        estimate_days: 2
        satisfies: [FEAT-108-AC-2, FEAT-108-AC-4, FEAT-108-AC-7]
        status: proposed
        depends_on: []
      - id: STORY-108-3
        title: "Harden Society portal accounts & authority: edge/empty handling (FEAT-108-AC-6, FEAT-108-AC-8, FEAT-108-AC-9)"
        estimate_days: 2
        satisfies: [FEAT-108-AC-6, FEAT-108-AC-8, FEAT-108-AC-9]
        status: proposed
        depends_on: []

