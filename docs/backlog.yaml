    target: "R0 + ~18 weeks"
    exit_condition: "A second and third society go through the same loop without ops improvising a workaround, and the ops home queue is where a day genuinely starts."
    features: [FEAT-004, FEAT-005, FEAT-008, FEAT-009, FEAT-010, FEAT-015, FEAT-016, FEAT-017, FEAT-021, FEAT-022, FEAT-023, FEAT-025, FEAT-030, FEAT-031, FEAT-032, FEAT-057, FEAT-058, FEAT-065, FEAT-066, FEAT-067, FEAT-068, FEAT-088, FEAT-094, FEAT-095, FEAT-096, FEAT-097, FEAT-099, FEAT-100, FEAT-101, FEAT-107]
