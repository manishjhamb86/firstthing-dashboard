        tests: [TC-035-4]
        scope_note: >-
          Reconciled with SCR-062 on 2026-08-14 while building MS-06. The screen spec
          lists the approval permission as "office-bearer, committee, or manager", which
          reads as any portal role; this AC says only the named onlooker's approval
          satisfies the gate. Both are right and they are about different things: the
          onlooker may hold any of the three roles (SCR-060 assigns them as a society
          contact), and it is being *named* that confers the approval right. Implemented
          that way, and deliberately kept distinct from GATE-04, which governs binding
          acts and does key off office-bearer authority. Requiring office-bearer here
          would hand a hard daily deadline to the person least likely to be on site.
