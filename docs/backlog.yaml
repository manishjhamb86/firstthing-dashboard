        type: happy
        given: "a lead-stage `Pipeline` exists"
        when: "PER-07 records the proposal outcome as \"agreed,\""
        then: "the `Pipeline` advances to `survey-pending` and CAP-16 can now be started against it"
        tests: [TC-002-1]
      - id: FEAT-002-AC-2
        type: empty
