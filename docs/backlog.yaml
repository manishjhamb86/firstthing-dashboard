features:
  - id: FEAT-001
    title: "Log a new lead"
    capability: CAP-15
    personas: [PER-07]
    surfaces: [SUR-01]
    size: S
    serves: [JTBD-08]
    description: "Sales/BD (or backend on their behalf) logs a new lead after a first meeting: society name/location, contact person, meeting date, notes, and which service line(s) (SVC-01..04) the conversation covered. This is the first event in that (society, service line)'s pipeline (CON-24) — creates the `Pipeline` record at its earliest stage."
    priority:
      method: RICE
      reach: 6
      impact: 1
      confidence: 0.8
      effort_sessions: 2
      score: 2.4
      estimate_confidence: high
      rank: 37
      note: "Small, but it is the first event in every deal"
      override_reason: null
    release: R0
    depends_on: []
    status: ready
    milestone: MS-03
    acceptance_criteria:
      - id: FEAT-001-AC-1
        type: happy
        given: "PER-07 is logged in"
        when: "they submit a new lead with society name, contact, meeting date, and service line"
        then: "a `Pipeline` record is created at stage `lead`, marked authoritative immediately (no approval needed for self-logged entries)"
        tests: [TC-001-1]
      - id: FEAT-001-AC-2
        type: happy
        given: "PER-01 logs a lead on PER-07's behalf"
        when: "submitted"
        then: "the `Pipeline` record is created at stage `lead` in a `pending-approval` sub-state, and PER-07 is notified"
        tests: [TC-001-2]
      - id: FEAT-001-AC-3
        type: empty
        given: "no leads have ever been logged"
        when: "PER-07 opens the lead list"
        then: "an empty state explains how to log the first one"
        tests: [TC-001-3]
      - id: FEAT-001-AC-4
        type: failure
        given: "a required field (society name, service line) is missing"
        when: "the form is submitted"
        then: "it's rejected with a field-level error and no `Pipeline` record is created"
        tests: [TC-001-4]
      - id: FEAT-001-AC-5
        type: permission
        given: "a user without PER-07 or PER-01's role"
        when: "attempts to log a lead"
        then: "the action is unavailable/denied server-side, not just hidden in the UI"
        tests: [TC-001-5]
    stories:
      - id: STORY-001-1
        title: "As sales, I want to log a new lead after a first meeting, so that the deal has a system record from day one instead of living in someone's memory."
        estimate_days: 1
        satisfies: [FEAT-001-AC-1, FEAT-001-AC-2]
        status: ready
        depends_on: []
      - id: STORY-001-2
        title: "Harden Log a new lead: empty/failure/permission handling (FEAT-001-AC-3, FEAT-001-AC-4, FEAT-001-AC-5)"
        estimate_days: 2
        satisfies: [FEAT-001-AC-3, FEAT-001-AC-4, FEAT-001-AC-5]
        status: proposed
        depends_on: []
